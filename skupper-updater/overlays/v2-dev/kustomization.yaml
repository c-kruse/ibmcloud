apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: CronJob
      name: skupper-updater
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "*/30 * * * *"
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/args
        value: [--track, v2-dev]
